; Gotham Duo configuration
; Copy this file next to version.dll in:
;   LEGOBatmanLotDK\Binaries\Win64\gothamduo.ini

[Monitors]
; Monitor indices as logged in gothamduo.log (Monitor[0], Monitor[1], ...).
; Leave at -1 to auto-select the two landscape monitors ordered left-to-right.
Player1=-1
Player2=-1

[Input]
; Enable automatic switch on Controller 2 (Start -> Duo, hold Back+Start -> Solo).
AllowControllerToggle=1
; -1 = watch controller slots 1..3; or 0..3 for a specific XInput slot.
P2ControllerIndex=-1
; Milliseconds to hold Back+Start on Controller 2 to return to Solo mode.
HoldBackStartMs=800

[Hotkeys]
; Supported values: F1..F24, A..Z, D0..D9, Num0..Num9, Insert, Delete, Home, End,
; PageUp, PageDown, Pause, ScrollLock, PrintScreen, hex VK (e.g. 0x78), or None to disable.
ToggleDuoKey=F9
ToggleMirrorKey=F1
ReapplyResizeKey=F10

[MenuMirror]
; Automatically mirror menus, loading, and cutscenes at native resolution in Duo mode (1 = enabled, 0 = manual hotkey only).
AutoDetect=1
; Milliseconds a shared screen must be stable before switching to Mirror.
EnterMirrorMs=200
; Milliseconds a split-screen frame must be stable before returning to Split.
ExitMirrorMs=100

[Display]
; Optional manual resolution overrides in pixels (0 = auto-detect from monitors).
TargetWidth=0
TargetHeight=0
SoloWidth=0
SoloHeight=0

[Performance]
; In Duo mode, skip the game's own Present while the output windows cover it (the first output
; inherits the game's VSync/frame pacing). Set to 0 to always present the game swapchain too.
SuppressGamePresent=1

[Logging]
; Write gothamduo.log next to version.dll (1 = enabled, 0 = disabled).
Enabled=1
; Include high-frequency diagnostic messages such as frame heartbeats (1 = verbose, 0 = normal).
Verbose=0
